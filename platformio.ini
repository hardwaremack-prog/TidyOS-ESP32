; TidyOS for ESP32 - PlatformIO build
[platformio]
src_dir = source/TidyOS

[env:nodemcu-32s]
platform = espressif32 @ 6.9.0          ; = Arduino-ESP32 2.0.17 (FabGL does not support 3.x)
board = nodemcu-32s
framework = arduino
board_build.partitions = source/TidyOS/partitions.csv    ; app + update loader + storage
monitor_speed = 115200
lib_deps =
    fdivitto/FabGL @ 1.0.9
    h2zero/NimBLE-Arduino @ 1.4.3
build_flags =
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -Wl,--wrap=ff_disk_read            ; SD activity for the blue status light (led.cpp)
    -Wl,--wrap=ff_disk_write
    -Wl,--wrap=esp_panic_handler       ; crash recorder (crashlog.cpp)

; HTML5 edition: desktop in a web browser, no Bluetooth
[env:nodemcu-32s-html5]
extends = env:nodemcu-32s
build_flags =
    ${env:nodemcu-32s.build_flags}
    -DTIDYOS_HTML5

; The update loader (flashed at 0x300000 by the web flasher; build it once)
[env:loader]
platform = espressif32 @ 6.9.0
board = nodemcu-32s
framework = arduino
src_dir = source/TidyLoader
board_build.partitions = source/TidyLoader/partitions.csv
